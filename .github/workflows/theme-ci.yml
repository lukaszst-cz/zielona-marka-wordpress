name: WordPress theme CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  theme-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
      - name: Lint PHP files
        run: find . -name "*.php" -print0 | xargs -0 -n1 php -l
      - name: Verify migration files
        run: |
          test -s front-page.php
          test -s page-oferta.php
          test -s page-lokalna.php
          test -s page-jak-pracuje.php
          test -s page-raport-qa.php
          test -s inc/client-status.php
          test -s inc/studio.php
          test -s page-studio.php
          test -s page-umowa-przykladowa.php
          test -s page-transport.php
          test -s status-client.php
          test -s status-contract.php
          test -s status-qa.php
          test -s assets/css/live-home.css
          test -s assets/js/live-home.js
      - name: Verify key routes and hooks
        run: |
          grep -Fq "zm_local_landing_template" functions.php
          grep -Fq "inc/client-status.php" functions.php
          grep -Fq "inc/studio.php" functions.php
          grep -Fq "zm_store_inquiry" functions.php
          grep -Fq "zm_register_status_routes" inc/client-status.php
          grep -Fq "status/([^/]+)/umowa" inc/client-status.php
          grep -Fq "status/([^/]+)/qa" inc/client-status.php
          grep -Fq "chatbot-dla-firm" functions.php
          grep -Fq "define('ZM_VERSION', '1.4.0');" functions.php
          grep -Fq "transport" page-transport.php
      - name: Validate Playground blueprints
        run: |
          python -m json.tool blueprint.json >/dev/null
          python -m json.tool blueprint-preview.json >/dev/null
          grep -Fq "sync-live-1to1-2026-09-27" blueprint-preview.json

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Start WordPress Playground
        run: |
          nohup npx --yes @wp-playground/cli@latest server --blueprint=blueprint-preview.json --skip-browser --port=9400 > /tmp/playground.log 2>&1 &
          echo $! > /tmp/playground.pid
          for i in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:9400/ > /tmp/playground-home.html; then
              exit 0
            fi
            sleep 2
          done
          cat /tmp/playground.log
          exit 1
      - name: Runtime WordPress smoke tests
        run: |
          check_200() {
            path="$1"
            marker="$2"
            code=$(curl -sS -o /tmp/route.html -w "%{http_code}" "http://127.0.0.1:9400$path")
            if [ "$code" != "200" ]; then
              echo "Expected 200 for $path, got $code"
              cat /tmp/route.html
              exit 1
            fi
            if ! grep -Fq "$marker" /tmp/route.html; then
              echo "Marker not found for $path: $marker"
              exit 1
            fi
          }

          check_200 "/" "Masz dobrą firmę."
          check_200 "/oferta/" "ZM Start"
          check_200 "/kontakt/" "KONTAKT I WYCENA"
          check_200 "/maly-crm-dla-firm/" "Każdy klient ma status."
          check_200 "/jak-pracuje/" "JAK PRACUJĘ"
          check_200 "/realizacje/" "REALIZACJE I DEMONSTRACJE"
          check_200 "/strony-internetowe/targowek/" "TARGÓWEK"
          check_200 "/strony-internetowe/warszawa/" "WARSZAWA"
          check_200 "/demo/natura/" "Natura Studio"
          check_200 "/demo/transport/" "ZIELONY TRANSPORT"
          check_200 "/en/" "You have a good business."
          check_200 "/status/" "STREFA KLIENTA"
          check_200 "/status/ZM-DEMO-2026/" "Przykładowa strona usługowa"
          check_200 "/status/ZM-DEMO-2026/qa/" "Kontrola jakości"
          check_200 "/status/ZM-DEMO-2026/umowa/" "Umowa o wykonanie projektu"

          chatbot=$(curl -sS -o /dev/null -w "%{http_code}" http://127.0.0.1:9400/chatbot-dla-firm/)
          test "$chatbot" = "301" || { echo "Expected 301 for chatbot compatibility route, got $chatbot"; exit 1; }

          studio=$(curl -sS -o /dev/null -w "%{http_code}" http://127.0.0.1:9400/studio/)
          test "$studio" = "302" || { echo "Expected login redirect for /studio/, got $studio"; exit 1; }

          missing=$(curl -sS -o /dev/null -w "%{http_code}" http://127.0.0.1:9400/nie-istnieje-zielona-marka/)
          test "$missing" = "404" || { echo "Expected 404 for missing route, got $missing"; exit 1; }
      - name: Show Playground log on failure
        if: failure()
        run: cat /tmp/playground.log || true
