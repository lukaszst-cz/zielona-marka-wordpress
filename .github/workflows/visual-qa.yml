name: Visual QA

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: wordpress-visual-qa-${{ github.ref }}
  cancel-in-progress: true

jobs:
  screenshots:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install visual QA tools
        run: |
          npm install --no-save @wp-playground/cli@latest playwright@latest
          npx playwright install --with-deps chromium
      - name: Capture production and WordPress screenshots
        run: node scripts/visual-qa.mjs
      - name: Upload visual QA artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: visual-qa
          path: visual-qa/
          if-no-files-found: warn
          retention-days: 14
